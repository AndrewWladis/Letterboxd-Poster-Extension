<!DOCTYPE html>
<html>
<head>
    <title>Letterboxd Poster Changer</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
            background-color: #43454a;
            font-family: 'Roboto', sans-serif;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        h1 {
            color: #fff;
        }

        input {
            border: 1px solid #fff;
            border-radius: 5px;
        }

        input[type="text"] {
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
            padding: 8px;
        }

        #status {
            min-height: 18px;
            margin-top: 10px;
        }

        .success {
            color: #8fda8f;
        }

        .error {
            color: #ff9a9a;
        }
    </style>
</head>
<body>
    <h1>Letterboxd Poster Changer</h1>
    <input type="text" id="movieTitle" placeholder="Enter movie title (Exactly how it's written on Letterboxd)">
    <input type="text" id="movieYear" placeholder="Enter release year (e.g. 2025)" inputmode="numeric">
    <input type="text" id="posterUrl" placeholder="Enter new poster URL">
    <button id="changePoster">Change Poster</button>
    <div id="status" role="status" aria-live="polite"></div>

    <script src="popup.js"></script>
</body>
</html>
